<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Franek Demon List</title>
<style>
:root{color-scheme:light;--bg:#fff;--panel:#fff;--panel2:#f6f6f6;--text:#17191c;--muted:#6d7279;--accent:#17191c;--line:#e3e5e8;--gold:#c79524;--danger:#c94b58}
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:0 18px 55px}
.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:26px;background:#fff;position:sticky;top:0;z-index:5}.topinner{max-width:1180px;width:100%;margin:auto;padding:0 18px;display:flex;align-items:center;gap:26px}.logo{font-size:20px;font-weight:900;letter-spacing:.5px}.logo span{color:#6d7279}.nav{display:flex;gap:20px}.nav a{color:#6d7279;text-decoration:none;font-size:14px;font-weight:700}.nav a.active,.nav a:hover{color:#17191c}.spacer{flex:1}.topcount{font-size:12px;color:#777d85}
.hero{padding:42px 0 25px;border-bottom:1px solid var(--line);background:#fff}.brand{font-size:36px;font-weight:900;letter-spacing:-1px}.brand span{color:#6d7279}.sub{color:var(--muted);margin-top:7px;font-size:14px}.heroRow{display:flex;justify-content:space-between;align-items:end;gap:20px}.badge{padding:7px 11px;border:1px solid #dfe2e5;background:#f7f7f8;color:#5f646b;font-size:12px;border-radius:3px;font-weight:700}
.controls{display:flex;gap:9px;flex-wrap:wrap;padding:20px 0 12px}.search{flex:1;min-width:240px}.input,.select{width:100%;background:#fff;border:1px solid #d5d8dc;color:var(--text);padding:11px 12px;border-radius:3px;outline:none}.input:focus,.select:focus{border-color:#8b9097}.tabs{display:flex;gap:0;align-items:center;border-bottom:1px solid var(--line);margin-bottom:13px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:#6d7279;padding:12px 15px;cursor:pointer;font-weight:700;font-size:13px}.tab.active{color:#17191c;border-bottom-color:#17191c}.add{border:1px solid #cfd3d7;background:#17191c;color:#fff;padding:10px 13px;border-radius:3px;cursor:pointer;font-weight:800;margin-left:auto}.add:hover{background:#30343a}
.card{position:relative;overflow:hidden;min-height:150px;margin:9px 0;border:1px solid #30343a;border-radius:8px;background:#17191c;display:grid;grid-template-columns:92px 1fr 120px;align-items:center;gap:18px;padding:18px 20px;isolation:isolate;box-shadow:0 8px 24px #0004}.card::before{content:"";position:absolute;inset:0;background:var(--cover) center/cover no-repeat;filter:saturate(.9);z-index:-3;transform:scale(1.02)}.card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#101216f2 0%,#121419df 34%,#121419c8 65%,#101216ed 100%),linear-gradient(0deg,#101216b8,#101216b8);z-index:-2}.card:hover{border-color:#555b63;box-shadow:0 12px 30px #0006;transform:translateY(-1px)}.card.no-cover::before{background:#191c20}.cover{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.rank{font-size:38px;line-height:1;font-weight:950;color:#d8dce1;text-align:center;text-shadow:0 2px 10px #000}.rank::first-letter{color:#fff}.level{font-size:25px;line-height:1.15;font-weight:900;letter-spacing:-.4px;text-shadow:0 2px 10px #000}.meta{color:#c0c5cc;font-size:13px;line-height:1.6;margin-top:8px;text-shadow:0 1px 6px #000}.record{text-align:right;min-width:100px;text-shadow:0 2px 10px #000}.percent{font-size:28px;font-weight:950}.proof{display:inline-block;margin-top:5px;color:#d7dbe0;text-decoration:none;font-size:12px;font-weight:700}.proof:hover{color:#fff}.delete{margin-top:7px;border:1px solid #684047;background:#29191cdd;color:#f09aa3;border-radius:4px;padding:5px 8px;cursor:pointer;font-size:11px}.delete:hover{background:#3a1e23}.empty{padding:35px;text-align:center;color:var(--muted)}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.sectionTitle h2{font-size:16px;margin:0}.sectionTitle span{font-size:12px;color:#777d85}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.hidden{display:none}.modalbox{width:min(620px,100%);background:#fff;border:1px solid #dfe2e5;border-radius:4px;padding:20px;box-shadow:0 25px 80px #000}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0 0 16px}.x{border:0;background:transparent;color:#666;font-size:28px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:12px;color:var(--muted);display:grid;gap:6px}.formactions{display:flex;justify-content:flex-end;margin-top:16px}.small{font-size:12px;color:var(--muted)}footer{color:#666c73;text-align:center;margin-top:28px;font-size:12px;border-top:1px solid var(--line);padding-top:18px}
@media(max-width:700px){.nav{display:none}.heroRow{align-items:start;flex-direction:column}.brand{font-size:28px}.formgrid{grid-template-columns:1fr}.add{margin-left:0}.card{grid-template-columns:58px 1fr;min-height:155px;padding:16px 14px;gap:12px}.record{grid-column:2;text-align:left;margin-top:4px}.rank{font-size:25px}.level{font-size:21px}.meta{font-size:12px}.percent{font-size:23px}}
</style></head>
<header class="topbar"><div class="topinner"><div class="logo">FRANEK <span>DEMON LIST</span></div><nav class="nav"><a class="active" href="#">Ranking</a><a href="#">Levels</a><a href="#">Players</a><a href="#">Records</a></nav><div class="spacer"></div><div class="topcount">GEOMETRY DASH • DEMON LIST</div></div></header>
<main class="wrap">
<section class="hero"><div class="heroRow"><div><div class="brand">FRANEK <span>DEMON LIST</span></div><div class="sub">Ranking leveli Geometry Dash według trudności</div></div><div class="badge">LAST UPDATED • 2026</div></div></section>
<div class="controls"><div class="search"><input id="q" class="input" placeholder="Search levels, creators or verifiers..."></div><select id="sort" class="select" style="max-width:190px"><option value="rank">Rank</option><option value="name">Name</option><option value="record">Record</option></select></div>
<div class="tabs"><button class="tab active" data-filter="all">Demon List</button><button class="tab" data-filter="extreme">Extreme Demons</button><button class="tab" data-filter="medium">Medium Demons</button><button class="tab" data-filter="easy">Easy Demons</button><button id="addBtn" class="add">+ Dodaj level</button></div>
<div class="sectionTitle"><h2>DEMON LIST</h2><span>Ranked by position</span></div><section id="list"></section>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2>Dodaj level</h2><button id="close" class="x">×</button></div><div class="formgrid">
<label>Nazwa levela<input id="name" class="input" placeholder="np. Bloodbath"></label>
<label>Autor<input id="author" class="input" placeholder="np. Riot"></label>
<label>Zweryfikował<input id="verifier" class="input" placeholder="np. RobTop"></label>
<label>Pozycja<input id="rank" class="input" type="number" min="1" placeholder="np. 11"></label>
<label>Rekord (%)<input id="record" class="input" type="number" min="0" max="100" placeholder="np. 73"></label>
<label>Typ<select id="type" class="select"><option value="extreme">Extreme Demon</option><option value="insane">Insane Demon</option><option value="hard">Hard Demon</option><option value="medium">Medium Demon</option><option value="easy">Easy Demon</option></select></label>
<label>Proof (link)<input id="proof" class="input" placeholder="https://..." type="url"></label>
<label>Okładka levela<input id="cover" class="input" type="file" accept="image/*"><span class="small">Wybierz zdjęcie z galerii telefonu lub plik z urządzenia.</span></label>
</div><div class="formactions"><button id="save" class="add">Dodaj do listy</button></div><div id="msg" class="small"></div></div></div>
<footer>Franek Demon List • wersja demonstracyjna • rekordy wymagają proofa</footer>
</main>
<script>
const defaults=[
{name:'Bloodbath',author:'Riot',rank:1,record:100,type:'extreme',proof:'#'},
{name:'Slaughterhouse',author:'Icedcave',rank:2,record:94,type:'extreme',proof:'#'},
{name:'Acheron',author:'Ryamu',rank:3,record:87,type:'extreme',proof:'#'},
{name:'Tidal Wave',author:'OniLink',rank:4,record:82,type:'extreme',proof:'#'},
{name:'Sonic Wave',author:'Cyclic',rank:5,record:76,type:'extreme',proof:'#'},
{name:'Artificial Ascent',author:'ViPriN',rank:6,record:71,type:'extreme',proof:'#'},
{name:'Cataclysm',author:'GgB0y',rank:7,record:68,type:'extreme',proof:'#'},
{name:'Nine Circles',author:'Zobros',rank:8,record:63,type:'extreme',proof:'#'},
{name:'Digital Descent',author:'JonathanGD',rank:9,record:55,type:'extreme',proof:'#'},
{name:'Hypersonic',author:'Viprin',rank:10,record:49,type:'extreme',proof:'#'}];
let levels=JSON.parse(localStorage.getItem('franekLevels')||'null')||defaults;levels=levels.map((x,i)=>({...x,id:x.id||('lvl_'+i)}));
let filter='all';
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveData(){localStorage.setItem('franekLevels',JSON.stringify(levels))}
function render(){const q=document.getElementById('q').value.toLowerCase();let arr=levels.filter(x=>(filter==='all'||x.type===filter)&&(`${x.name} ${x.author} ${x.verifier||''}`.toLowerCase().includes(q)));const sort=document.getElementById('sort').value;if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));else if(sort==='record')arr.sort((a,b)=>b.record-a.record);else arr.sort((a,b)=>a.rank-b.rank);document.getElementById('list').innerHTML=arr.length?arr.map(x=>`<article class="card ${x.cover?'':'no-cover'}" style="--cover:url('${esc(x.cover||'')}')"><div class="rank">#${x.rank}</div><div><div class="level">${esc(x.name)}</div><div class="meta">Autor: ${esc(x.author)}<br>Zweryfikował: ${esc(x.verifier||'Nie podano')}</div></div><div class="record"><div class="percent">${x.record}%</div><a class="proof" href="${esc(x.proof||'#')}" target="_blank">proof →</a><br><button class="delete" data-id="${x.id}">Usuń level</button></div></article>`).join(''):'<div class="empty">Nie znaleziono leveli 😭</div>'}
const modal=document.getElementById('modal');
document.getElementById('addBtn').onclick=()=>{modal.classList.remove('hidden');document.getElementById('name').focus()};
document.getElementById('close').onclick=()=>modal.classList.add('hidden');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.add('hidden')});
document.getElementById('save').onclick=()=>{const name=document.getElementById('name').value.trim(),author=document.getElementById('author').value.trim(),verifier=document.getElementById('verifier').value.trim(),rank=Number(document.getElementById('rank').value),record=Number(document.getElementById('record').value),type=document.getElementById('type').value,proof=document.getElementById('proof').value.trim()||'#',file=document.getElementById('cover').files[0];const msg=document.getElementById('msg');if(!name||!author||!verifier||!rank||record<0||record>100){msg.textContent='Uzupełnij nazwę, autora, osobę weryfikującą, pozycję i poprawny rekord';return}const addLevel=cover=>{levels.push({id:'lvl_'+Date.now(),name,author,verifier,rank,record,type,proof,cover:cover||''});try{saveData();render();modal.classList.add('hidden');['name','author','verifier','rank','record','proof'].forEach(id=>document.getElementById(id).value='');document.getElementById('cover').value='';msg.textContent=''}catch(e){msg.textContent='Obrazek jest za duży. Wybierz mniejsze zdjęcie.'}};if(file){if(!file.type.startsWith('image/')){msg.textContent='Wybierz plik graficzny.';return}if(file.size>3*1024*1024){msg.textContent='Obrazek jest za duży. Wybierz zdjęcie do 3 MB.';return}const reader=new FileReader();reader.onload=()=>addLevel(reader.result);reader.onerror=()=>{msg.textContent='Nie udało się wczytać obrazka.'};reader.readAsDataURL(file)}else addLevel('')};
document.getElementById('q').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});render();
document.addEventListener('click',e=>{if(!e.target.classList.contains('delete'))return;const id=e.target.dataset.id;const level=levels.find(x=>x.id===id);if(level&&confirm('Usunąć level „'+level.name+'”?')){levels=levels.filter(x=>x.id!==id);saveData();render()}});
</script></body></html>
